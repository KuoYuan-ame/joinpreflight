
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granguard"
version = "0.1.0"
description = "Data grain and join safety diagnostics"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
granguard = "granguard.cli:main"
