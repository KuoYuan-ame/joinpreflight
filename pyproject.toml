[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "joinpreflight"
version = "0.1.0"
description = "JOIN cardinality diagnostics, aggregation risk analysis, and exploratory statistical tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scipy>=1.11,<2",
]


keywords = ["data-quality", "pandas", "joins", "data-engineering", "cardinality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]



[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1",
    "twine>=6",
]

viz = [
    "matplotlib>=3.8",
    "scipy>=1.11,<2",
]



[project.scripts]
joinpreflight = "joinpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/KuoYuan-ame/joinpreflight"
Source = "https://github.com/KuoYuan-ame/joinpreflight"
Issues = "https://github.com/KuoYuan-ame/joinpreflight/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
