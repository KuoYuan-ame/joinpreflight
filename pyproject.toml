[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joinpreflight"
version = "0.1.0"
description = "Preflight diagnostics for pandas JOIN cardinality and row expansion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4",
]
keywords = ["data-quality", "pandas", "joins", "data-engineering", "cardinality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1",
    "twine>=6",
    "matplotlib>=3.8"
]
viz = [
    "matplotlib>=3.8",
    "scipy"
]


[project.scripts]
joinpreflight = "joinpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/joinpreflight"
Source = "https://github.com/YOUR_GITHUB_USERNAME/joinpreflight"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/joinpreflight/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
