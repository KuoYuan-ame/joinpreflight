# Publishes a GitHub Release (not PyPI) after a version tag is pushed.
name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and publishing tools
        run: python -m pip install -e ".[dev]"

      - name: Check version matches git tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == f'v{version}', f'{tag} != v{version}'
          PY

      - name: Run tests
        run: python -m pytest -v

      - name: Build packages
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
